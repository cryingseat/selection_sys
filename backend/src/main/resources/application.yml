server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: selection-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selection_sys}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:@Cryingseat1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.labselection.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: 'NULL'
    cache-enabled: false

app:
  # 登录令牌有效期（小时）
  token-ttl-hours: 12
  # 生产环境建议设为 true：除流程阶段外，还会严格校验各阶段起止时间。
  # 演示环境设为 false，便于管理员手动推进阶段完整走通流程。
  enforce-time-window: false
  demo-mode: true
  cors-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    root: INFO
    com.labselection: INFO
    com.labselection.mapper: WARN
